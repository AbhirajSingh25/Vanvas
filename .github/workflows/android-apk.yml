name: VANVAS Android Build Pipeline (APK & AAB)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - 'packages/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK & AAB Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Shared Package
        working-directory: ./packages/shared
        run: |
          npm install
          npx tsc

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: Mobile TypeScript Typecheck
        working-directory: ./mobile
        run: npx tsc --noEmit

      - name: Mobile Expo Diagnostics
        working-directory: ./mobile
        run: npx expo config

      - name: Prebuild Android from Expo
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure Android SDK & Gradle Wrapper
        working-directory: ./mobile/android
        run: |
          tr -d '\r' < gradlew > gradlew.tmp && mv gradlew.tmp gradlew
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Android SDK Permissions & Platform 36/37
        run: |
          sudo chown -R $USER:$USER $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" || true

      - name: Build Debug APK
        working-directory: ./mobile/android
        run: |
          set -euo pipefail
          echo "=== Java and Android SDK Diagnostics ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME:-unset}"
          echo "ANDROID_HOME: ${ANDROID_HOME:-unset}"
          echo "=== Gradle Version ==="
          bash ./gradlew --version
          echo "=== Assembling Debug APK ==="
          bash ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle_output.txt
          echo "=== Generated APK Files ==="
          ls -la app/build/outputs/apk/debug/
          DEBUG_APK=$(find app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          if [ -z "$DEBUG_APK" ] || [ ! -s "$DEBUG_APK" ]; then
            echo "ERROR: Non-empty debug APK not found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Successfully built debug APK: $DEBUG_APK"

      - name: Prepare Debug APK Artifact & Checksum
        id: prep-debug-apk
        working-directory: ./mobile/android
        run: |
          set -euo pipefail
          APK_NAME="VANVAS-Android-v0.4.0-code4-debug.apk"
          echo "Locating built APK under app/build/outputs/apk/debug/..."
          APK_SRC=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ] || [ ! -s "$APK_SRC" ]; then
            echo "ERROR: No valid non-empty APK found under app/build/outputs/apk/debug/"
            echo "Discovered APK files:"
            find . -name "*.apk"
            exit 1
          fi
          echo "Found APK: $APK_SRC"
          APK_DIR=$(dirname "$APK_SRC")
          cp "$APK_SRC" "${APK_DIR}/${APK_NAME}"
          cd "$APK_DIR"
          if [ ! -s "${APK_NAME}" ]; then
            echo "ERROR: Artifact ${APK_NAME} does not exist or is empty"
            exit 1
          fi
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          SHA_VALUE=$(cat "${APK_NAME}.sha256" | awk '{print $1}')
          FILE_SIZE=$(du -h "${APK_NAME}" | cut -f1)
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA_VALUE}" >> $GITHUB_OUTPUT
          echo "file_size=${FILE_SIZE}" >> $GITHUB_OUTPUT
          echo "Successfully prepared: ${APK_NAME} (${FILE_SIZE}, SHA-256: ${SHA_VALUE})"

      - name: Check For Release Signing Secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "has_release_keys=true" >> $GITHUB_OUTPUT
            echo "Release keystore secrets detected."
          else
            echo "has_release_keys=false" >> $GITHUB_OUTPUT
            echo "Release keystore secrets not present. Building validation bundles."
          fi

      - name: Configure Release Keystore (If Available)
        if: steps.check-secrets.outputs.has_release_keys == 'true'
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/vanvas-release-upload.jks"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${KEYSTORE_PATH}"
          echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          python3 - << 'EOF'
          import os
          path = 'mobile/android/app/build.gradle'
          if os.path.exists(path):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              old_signing = "signingConfigs {"
              new_signing = """signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }"""
              if "release {" not in content:
                  content = content.replace(old_signing, new_signing, 1)
                  content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release", 1)
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print("Injected release signingConfig into mobile/android/app/build.gradle")
          EOF

      - name: Build Signed Production Android App Bundle (AAB)
        if: steps.check-secrets.outputs.has_release_keys == 'true'
        id: build-prod-aab
        working-directory: ./mobile/android
        run: |
          set -euo pipefail
          echo "=== Assembling Production AAB with Organization Release Signing Credentials ==="
          bash ./gradlew bundleRelease --stacktrace 2>&1 | tee /tmp/gradle_aab_prod_output.txt
          
          RELEASE_AAB_SRC=$(find app/build/outputs/bundle/release -type f -name "*.aab" | head -n 1)
          if [ -z "$RELEASE_AAB_SRC" ] || [ ! -s "$RELEASE_AAB_SRC" ]; then
            echo "ERROR: Non-empty release AAB not found in app/build/outputs/bundle/release/"
            exit 1
          fi
          
          echo "=== Verifying Production Certificate with keytool ==="
          CERT_INFO=$(keytool -printcert -jarfile "$RELEASE_AAB_SRC" || true)
          echo "$CERT_INFO"
          
          if echo "$CERT_INFO" | grep -qi "CN=Android Debug"; then
            echo "ERROR: Production AAB is signed with Android Debug certificate! Failing build."
            exit 1
          fi
          
          FINGERPRINT=$(echo "$CERT_INFO" | grep -E "SHA256:|SHA-256:" | head -n 1 || true)
          echo "Verified Release Certificate Fingerprint: $FINGERPRINT"
          
          AAB_NAME="VANVAS-Android-v0.4.0-code4-production.aab"
          AAB_DIR=$(dirname "$RELEASE_AAB_SRC")
          cp "$RELEASE_AAB_SRC" "${AAB_DIR}/${AAB_NAME}"
          cd "$AAB_DIR"
          sha256sum "${AAB_NAME}" > "${AAB_NAME}.sha256"
          AAB_SHA=$(cat "${AAB_NAME}.sha256" | awk '{print $1}')
          AAB_SIZE=$(du -h "${AAB_NAME}" | cut -f1)
          
          echo "aab_name=${AAB_NAME}" >> $GITHUB_OUTPUT
          echo "sha256=${AAB_SHA}" >> $GITHUB_OUTPUT
          echo "file_size=${AAB_SIZE}" >> $GITHUB_OUTPUT
          echo "fingerprint=${FINGERPRINT}" >> $GITHUB_OUTPUT
          echo "Successfully generated production AAB: ${AAB_NAME} (${AAB_SIZE}, SHA-256: ${AAB_SHA})"

      - name: Build Validation Android App Bundle (AAB)
        if: steps.check-secrets.outputs.has_release_keys == 'false'
        id: build-val-aab
        working-directory: ./mobile/android
        run: |
          set -euo pipefail
          echo "=== Assembling Validation AAB (Debug-Signed Bundle for Packaging Verification) ==="
          bash ./gradlew bundleDebug --stacktrace 2>&1 | tee /tmp/gradle_aab_val_output.txt
          
          VAL_AAB_SRC=$(find app/build/outputs/bundle/debug -type f -name "*.aab" | head -n 1)
          if [ -z "$VAL_AAB_SRC" ] || [ ! -s "$VAL_AAB_SRC" ]; then
            echo "ERROR: Non-empty validation AAB not found in app/build/outputs/bundle/debug/"
            exit 1
          fi
          
          AAB_NAME="VANVAS-Android-v0.4.0-code4-validation.aab"
          AAB_DIR=$(dirname "$VAL_AAB_SRC")
          cp "$VAL_AAB_SRC" "${AAB_DIR}/${AAB_NAME}"
          cd "$AAB_DIR"
          sha256sum "${AAB_NAME}" > "${AAB_NAME}.sha256"
          AAB_SHA=$(cat "${AAB_NAME}.sha256" | awk '{print $1}')
          AAB_SIZE=$(du -h "${AAB_NAME}" | cut -f1)
          
          echo "aab_name=${AAB_NAME}" >> $GITHUB_OUTPUT
          echo "sha256=${AAB_SHA}" >> $GITHUB_OUTPUT
          echo "file_size=${AAB_SIZE}" >> $GITHUB_OUTPUT
          echo "Successfully generated validation AAB: ${AAB_NAME} (${AAB_SIZE}, SHA-256: ${AAB_SHA})"

      - name: Build Signed Release APK (If Keystore Available)
        if: steps.check-secrets.outputs.has_release_keys == 'true'
        working-directory: ./mobile/android
        run: |
          bash ./gradlew assembleRelease --stacktrace
          RELEASE_APK_SRC=$(find app/build/outputs/apk/release -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK_SRC" ]; then
            RELEASE_DIR=$(dirname "$RELEASE_APK_SRC")
            SIGNED_APK="VANVAS-Android-v0.4.0-code4-release-signed.apk"
            cp "$RELEASE_APK_SRC" "${RELEASE_DIR}/${SIGNED_APK}"
            cd "$RELEASE_DIR"
            sha256sum "${SIGNED_APK}" > "${SIGNED_APK}.sha256"
          fi

      - name: Cleanup Temporary Keystore
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/vanvas-release-upload.jks" || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VANVAS-Android-v0.4.0-code4-debug
          path: |
            mobile/android/**/VANVAS-Android-*-debug.apk
            mobile/android/**/VANVAS-Android-*-debug.apk.sha256
          retention-days: 30

      - name: Upload Production AAB Artifact (If Built)
        if: steps.check-secrets.outputs.has_release_keys == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VANVAS-Android-v0.4.0-code4-production
          path: |
            mobile/android/**/VANVAS-Android-*-production.aab
            mobile/android/**/VANVAS-Android-*-production.aab.sha256
          retention-days: 30

      - name: Upload Validation AAB Artifact (If Built)
        if: steps.check-secrets.outputs.has_release_keys == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: VANVAS-Android-v0.4.0-code4-validation
          path: |
            mobile/android/**/VANVAS-Android-*-validation.aab
            mobile/android/**/VANVAS-Android-*-validation.aab.sha256
          retention-days: 30

      - name: Upload Signed Release APK Artifact (If Built)
        if: steps.check-secrets.outputs.has_release_keys == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VANVAS-Android-v0.4.0-code4-release-signed
          path: |
            mobile/android/app/build/outputs/apk/release/VANVAS-Android-*-release-signed.apk
            mobile/android/app/build/outputs/apk/release/VANVAS-Android-*-release-signed.apk.sha256
          retention-days: 30

      - name: Generate Build Summary
        run: |
          echo "## 🚀 VANVAS Android Build Complete (APK & Play Store AAB)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package ID** | \`ai.vanvas.app\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Code** | \`4\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Name** | \`0.4.0\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target SDK** | \`36\` (Android 16+) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Debug APK Name** | \`${{ steps.prep-debug-apk.outputs.apk_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Debug APK Size** | \`${{ steps.prep-debug-apk.outputs.file_size }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Debug SHA-256** | \`${{ steps.prep-debug-apk.outputs.sha256 }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-secrets.outputs.has_release_keys }}" = "true" ]; then
            echo "| **Production AAB Name** | \`${{ steps.build-prod-aab.outputs.aab_name }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Production AAB Size** | \`${{ steps.build-prod-aab.outputs.file_size }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Production SHA-256** | \`${{ steps.build-prod-aab.outputs.sha256 }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Release Certificate** | Verified non-debug (\`${{ steps.build-prod-aab.outputs.fingerprint }}\`) |" >> $GITHUB_STEP_SUMMARY
            echo "| **Production Gate Status** | 🟢 UPLOAD-SIGNED (Ready for Google Play Console upload) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Validation AAB Name** | \`${{ steps.build-val-aab.outputs.aab_name }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Validation AAB Size** | \`${{ steps.build-val-aab.outputs.file_size }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Validation SHA-256** | \`${{ steps.build-val-aab.outputs.sha256 }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Production Gate Status** | 🟡 OWNER BLOCKED (Keystore secrets missing; validation bundle generated) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!IMPORTANT]" >> $GITHUB_STEP_SUMMARY
            echo "> **Action Required to Unblock Production Signing:**" >> $GITHUB_STEP_SUMMARY
            echo "> Set the following 4 secrets in GitHub Repository Settings -> Secrets and variables -> Actions:" >> $GITHUB_STEP_SUMMARY
            echo "> 1. \`ANDROID_KEYSTORE_BASE64\` (Base64-encoded upload keystore .jks)" >> $GITHUB_STEP_SUMMARY
            echo "> 2. \`ANDROID_KEYSTORE_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
            echo "> 3. \`ANDROID_KEY_ALIAS\`" >> $GITHUB_STEP_SUMMARY
            echo "> 4. \`ANDROID_KEY_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
          fi
