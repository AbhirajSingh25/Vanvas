name: VANVAS Android APK Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Application
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://vanvas-api.onrender.com

      - name: Capacitor Sync Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Debug APK Artifact & Checksum
        id: prep-debug-apk
        working-directory: ./frontend/android/app/build/outputs/apk/debug
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_NAME="VANVAS-Android-v0.2.0-${SHORT_SHA}-debug.apk"
          cp app-debug.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          SHA_VALUE=$(cat "${APK_NAME}.sha256" | awk '{print $1}')
          FILE_SIZE=$(du -h "${APK_NAME}" | cut -f1)
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA_VALUE}" >> $GITHUB_OUTPUT
          echo "file_size=${FILE_SIZE}" >> $GITHUB_OUTPUT

      - name: Check For Release Signing Secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "has_release_keys=true" >> $GITHUB_OUTPUT
          else
            echo "has_release_keys=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Signed Release APK (If Keystore Available)
        if: steps.check-secrets.outputs.has_release_keys == 'true'
        working-directory: ./frontend/android
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          KEYSTORE_PATH="${RUNNER_TEMP}/vanvas-release-upload.jks"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${KEYSTORE_PATH}"
          
          export ANDROID_KEYSTORE_PATH="${KEYSTORE_PATH}"
          export ANDROID_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          export ANDROID_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          export ANDROID_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          
          ./gradlew assembleRelease --stacktrace
          
          cd app/build/outputs/apk/release
          SIGNED_APK="VANVAS-Android-v0.2.0-${SHORT_SHA}-release-signed.apk"
          cp app-release.apk "${SIGNED_APK}"
          sha256sum "${SIGNED_APK}" > "${SIGNED_APK}.sha256"
          
          # Clean up temporary keystore file
          rm -f "${KEYSTORE_PATH}"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VANVAS-Android-${{ github.sha }}-debug
          path: |
            frontend/android/app/build/outputs/apk/debug/VANVAS-Android-*-debug.apk
            frontend/android/app/build/outputs/apk/debug/VANVAS-Android-*-debug.apk.sha256
          retention-days: 30

      - name: Upload Signed Release APK Artifact (If Built)
        if: steps.check-secrets.outputs.has_release_keys == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VANVAS-Android-${{ github.sha }}-release-signed
          path: |
            frontend/android/app/build/outputs/apk/release/VANVAS-Android-*-release-signed.apk
            frontend/android/app/build/outputs/apk/release/VANVAS-Android-*-release-signed.apk.sha256
          retention-days: 30

      - name: Generate Build Summary
        run: |
          echo "## 🚀 VANVAS Android APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package ID** | \`ai.vanvas.app\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Code** | \`2\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Name** | \`0.2.0\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Debug APK Name** | \`${{ steps.prep-debug-apk.outputs.apk_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Debug APK Size** | \`${{ steps.prep-debug-apk.outputs.file_size }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Debug SHA-256** | \`${{ steps.prep-debug-apk.outputs.sha256 }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Signing Status** | Debug Signed (Default) / Release Signed if secrets present |" >> $GITHUB_STEP_SUMMARY
