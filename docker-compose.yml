version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vanvas_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vanvas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vanvas_password}
      POSTGRES_DB: ${POSTGRES_DB:-vanvas_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vanvas_backend
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql://vanvas_user:vanvas_password@postgres:5432/vanvas_db}
      - SECRET_KEY=${SECRET_KEY:-vanvas-the-sorted-club-super-secret-key-himalayan-mist-2026}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vanvas_frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
