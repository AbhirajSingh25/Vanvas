<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VANVAS</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#173B32">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #173B32;
      color: #FAF4E8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      text-align: center;
      padding: 24px;
    }
    .logo {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 12px;
      color: #FAF4E8;
    }
    .tagline {
      font-size: 14px;
      color: #D4A373;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(250, 244, 232, 0.2);
      border-top-color: #FAF4E8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .offline-message {
      display: none;
      margin-top: 24px;
      font-size: 14px;
      color: rgba(250, 244, 232, 0.8);
      max-width: 280px;
      line-height: 1.5;
    }
    .retry-btn {
      display: none;
      margin-top: 20px;
      background-color: #D4A373;
      color: #173B32;
      border: none;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo">VANVAS</div>
  <div class="tagline">The Spirit of Indian Travel</div>
  <div class="spinner" id="spinner"></div>
  <div class="offline-message" id="offline-msg">Connecting to VANVAS... If you are offline, cached trips will be accessible once loaded.</div>
  <button class="retry-btn" id="retry-btn" onclick="window.location.reload()">Retry</button>

  <script>
    // In Capacitor, the remote server url (https://vanvasai.vercel.app) is automatically loaded by the WebView.
    // If the remote server fails to load or device is offline without cache, this fallback shell displays.
    window.addEventListener('online', () => {
      window.location.href = 'https://vanvasai.vercel.app';
    });
    setTimeout(() => {
      const msg = document.getElementById('offline-msg');
      const btn = document.getElementById('retry-btn');
      if (msg) msg.style.display = 'block';
      if (btn) btn.style.display = 'inline-block';
    }, 4000);
  </script>
</body>
</html>
