<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Deep Forest Green Background -->
  <rect width="100" height="100" rx="22" fill="#173B32"/>
  
  <defs>
    <!-- Gold Gradient for V and Star -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D184"/>
      <stop offset="35%" stop-color="#D4A349"/>
      <stop offset="70%" stop-color="#AE7D2E"/>
      <stop offset="100%" stop-color="#E2BA68"/>
    </linearGradient>

    <!-- Sun Sunset Gradient -->
    <radialGradient id="sun-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F17C38"/>
      <stop offset="80%" stop-color="#CB4D20"/>
      <stop offset="100%" stop-color="#9C320E"/>
    </radialGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="snow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F4ECE1"/>
      <stop offset="70%" stop-color="#9DB5A6"/>
      <stop offset="100%" stop-color="#1B382F"/>
    </linearGradient>

    <!-- Path Gradient -->
    <linearGradient id="path-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9E2A8"/>
      <stop offset="60%" stop-color="#D9A74E"/>
      <stop offset="100%" stop-color="#B8822B"/>
    </linearGradient>
  </defs>

  <!-- Golden 4-Point Apex Star -->
  <g transform="translate(50, 10)">
    <!-- Vertical Diamond -->
    <path d="M0 -9 L2.5 0 L0 9 L-2.5 0 Z" fill="url(#gold-grad)"/>
    <!-- Horizontal Diamond -->
    <path d="M-9 0 L0 2.5 L9 0 L0 -2.5 Z" fill="url(#gold-grad)"/>
    <!-- Star Center Core Spark -->
    <circle cx="0" cy="0" r="1.1" fill="#173B32"/>
  </g>

  <!-- Sunset Sun Disk (Centered behind mountain) -->
  <circle cx="50" cy="40" r="17" fill="url(#sun-grad)"/>

  <!-- Mountain Peak (Dark Forest + Snow Ridge) -->
  <!-- Dark pine forest silhouette fill behind snow -->
  <polygon points="50,26 34,58 66,58" fill="#162E25"/>

  <!-- Snow Ridges & Mountain Peaks -->
  <path d="M50 26 L56 38 L52 42 L66 58 L34 58 L46 41 L43 37 Z" fill="url(#snow-grad)"/>
  <path d="M50 26 L54 36 L50 44 L53 50 L50 58 L47 50 L50 44 L46 36 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Pine Trees Layer -->
  <path d="M34 58 L38 52 L42 58 L46 51 L50 58 L54 51 L58 58 L62 52 L66 58 Z" fill="#0D201A"/>

  <!-- Winding Golden Journey Road -->
  <path d="M53 50 C55 53 58 55 58 58 C58 62 48 64 45 68 C42 72 49 76 53 79 C57 82 56 86 50 91 L44 87 C49 84 50 82 46 79 C42 76 36 71 40 66 C44 61 51 60 50 56 C49 53 47 51 47 50 Z" fill="url(#path-grad)"/>

  <!-- Bold Master VANVAS Golden V Silhouette -->
  <!-- Left Serif Wing -->
  <path d="M12 21 C12 20 14 19 19 19 L38 19 C39 21 37 23 33 23 L28 23 C26 23 25 24 25.5 26 L45 77 L50 91 L50 91 L45 77 L25.5 26 Z" fill="url(#gold-grad)"/>
  <!-- Right Serif Wing -->
  <path d="M88 21 C88 20 86 19 81 19 L62 19 C61 21 63 23 67 23 L72 23 C74 23 75 24 74.5 26 L55 77 L50 91 L55 77 L74.5 26 Z" fill="url(#gold-grad)"/>

  <!-- Unified Solid V Body with Authentic Golden Stroke Profile -->
  <path d="M14 20 H36 C33 22 30 22.5 28 24.5 C26 26.5 27 30 28 33 L45 78 L50 92 L55 78 L72 33 C73 30 74 26.5 72 24.5 C70 22.5 67 22 64 20 H86 C83 23 81 25.5 80 28 L56 87 C54 92 46 92 44 87 L20 28 C19 25.5 17 23 14 20 Z" fill="url(#gold-grad)" stroke="#AE7D2E" stroke-width="0.75" stroke-linejoin="round"/>
</svg>