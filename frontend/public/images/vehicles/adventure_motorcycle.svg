<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFE5D2"/>
      <stop offset="60%" stop-color="#E5D5BA"/>
      <stop offset="100%" stop-color="#D8CBB2"/>
    </linearGradient>
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D4D44"/>
      <stop offset="100%" stop-color="#1B3B32"/>
    </linearGradient>
    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#173B32"/>
      <stop offset="100%" stop-color="#0F2924"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B4D36"/>
      <stop offset="100%" stop-color="#4A2E20"/>
    </linearGradient>
    <linearGradient id="bikeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B65E3C"/>
      <stop offset="100%" stop-color="#9E4D2E"/>
    </linearGradient>
    <linearGradient id="goldMist" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B49252" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B49252" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky & Ambient Mist -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  <circle cx="680" cy="120" r="70" fill="#B49252" opacity="0.25"/>

  <!-- Distant Himalayan Peaks -->
  <polygon points="0,320 120,180 240,290 380,140 520,280 660,160 800,290 800,500 0,500" fill="url(#mountainFar)" opacity="0.6"/>
  
  <!-- Mid-Ground Pine Ridges -->
  <polygon points="0,360 90,270 190,340 310,230 460,350 590,240 720,330 800,280 800,500 0,500" fill="url(#mountainMid)" opacity="0.85"/>

  <!-- Pine Tree Silhouettes on Ridge -->
  <g fill="#0F2924" opacity="0.9">
    <polygon points="80,270 85,250 90,270"/>
    <polygon points="82,260 85,245 88,260"/>
    <polygon points="120,300 126,275 132,300"/>
    <polygon points="305,235 310,210 315,235"/>
    <polygon points="320,245 325,220 330,245"/>
    <polygon points="585,245 590,220 595,245"/>
    <polygon points="600,255 604,235 608,255"/>
  </g>

  <!-- Mountain Ghat Pass Curve (Foreground Road) -->
  <path d="M 0 420 Q 300 370 800 440 L 800 500 L 0 500 Z" fill="url(#roadGrad)"/>
  <!-- Mountain Stone Kerb / Parapet -->
  <path d="M 0 415 Q 300 365 800 435" stroke="#E5D5BA" stroke-width="4" fill="none" stroke-dasharray="16,12" opacity="0.7"/>

  <!-- Sunlit Mist Glow -->
  <rect x="0" y="0" width="800" height="500" fill="url(#goldMist)"/>

  <!-- ======================================================== -->
  <!-- HIMALAYAN ADVENTURE MOTORCYCLE (High clearance, rally tank, windscreen) -->
  <!-- ======================================================== -->
  <g transform="translate(230, 175) scale(0.95)">
    <!-- Shadow -->
    <ellipse cx="180" cy="245" rx="140" ry="14" fill="#1B120C" opacity="0.45"/>

    <!-- Rear Wheel & Spokes -->
    <circle cx="70" cy="205" r="42" fill="#20211D" stroke="#0F2924" stroke-width="8"/>
    <circle cx="70" cy="205" r="32" fill="#FAF7F0" stroke="#7B4D36" stroke-width="2"/>
    <circle cx="70" cy="205" r="14" fill="#20211D"/>
    <!-- Rear Spoke lines -->
    <line x1="70" y1="173" x2="70" y2="237" stroke="#7B4D36" stroke-width="1.5"/>
    <line x1="38" y1="205" x2="102" y2="205" stroke="#7B4D36" stroke-width="1.5"/>
    <line x1="47" y1="182" x2="93" y2="228" stroke="#7B4D36" stroke-width="1.5"/>
    <line x1="47" y1="228" x2="93" y2="182" stroke="#7B4D36" stroke-width="1.5"/>

    <!-- Front Wheel & Spokes (Larger 21-inch rally wheel) -->
    <circle cx="280" cy="200" r="46" fill="#20211D" stroke="#0F2924" stroke-width="8"/>
    <circle cx="280" cy="200" r="35" fill="#FAF7F0" stroke="#7B4D36" stroke-width="2"/>
    <circle cx="280" cy="200" r="14" fill="#20211D"/>
    <!-- Front Spoke lines -->
    <line x1="280" y1="165" x2="280" y2="235" stroke="#7B4D36" stroke-width="1.5"/>
    <line x1="245" y1="200" x2="315" y2="200" stroke="#7B4D36" stroke-width="1.5"/>
    <line x1="255" y1="175" x2="305" y2="225" stroke="#7B4D36" stroke-width="1.5"/>
    <line x1="255" y1="225" x2="305" y2="175" stroke="#7B4D36" stroke-width="1.5"/>

    <!-- High Clearance Swingarm & Monoshock -->
    <polygon points="70,205 130,195 145,170 120,175" fill="#3D3E3A"/>
    <line x1="120" y1="175" x2="140" y2="140" stroke="#B49252" stroke-width="6"/>

    <!-- Upswept Adventure Exhaust Pipe -->
    <path d="M 140 185 Q 110 180 80 155 L 55 145" stroke="#535450" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M 80 155 L 50 145" stroke="#B65E3C" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Rugged Engine Block (DOHC Single) -->
    <rect x="130" y="155" width="48" height="42" rx="6" fill="#20211D" stroke="#3D3E3A" stroke-width="2"/>
    <line x1="135" y1="165" x2="173" y2="165" stroke="#535450" stroke-width="2"/>
    <line x1="135" y1="175" x2="173" y2="175" stroke="#535450" stroke-width="2"/>
    <line x1="135" y1="185" x2="173" y2="185" stroke="#535450" stroke-width="2"/>
    <!-- Crash Guard / Tank Cage -->
    <path d="M 160 140 L 195 145 L 180 190 L 150 180 Z" fill="none" stroke="#20211D" stroke-width="3"/>

    <!-- Dual-Spar Frame & Sculpted Fuel Tank (Terracotta & Forest) -->
    <path d="M 125 130 Q 155 105 210 108 L 225 140 L 175 150 Z" fill="url(#bikeAccent)"/>
    <path d="M 155 110 Q 185 110 210 120 L 205 135 L 155 125 Z" fill="#173B32"/>

    <!-- Long Tour Stepped Seat -->
    <path d="M 85 135 Q 120 130 155 135 L 150 148 Q 110 145 80 145 Z" fill="#20211D" stroke="#0F2924" stroke-width="1.5"/>

    <!-- Rear Aluminum Pannier / Expedition Luggage Rack -->
    <rect x="52" y="122" width="30" height="20" rx="3" fill="#B49252" stroke="#173B32" stroke-width="2"/>
    <line x1="52" y1="132" x2="82" y2="132" stroke="#173B32" stroke-width="1.5"/>

    <!-- Inverted Long-Travel Telescopic Front Forks -->
    <line x1="280" y1="200" x2="235" y2="90" stroke="#B49252" stroke-width="6"/>
    <line x1="274" y1="198" x2="230" y2="92" stroke="#20211D" stroke-width="4"/>

    <!-- High Front Beak / Mudguard -->
    <path d="M 235 120 L 280 130 L 265 138 Z" fill="#B65E3C"/>

    <!-- Tall Rally Windscreen & Round LED Headlight -->
    <circle cx="250" cy="98" r="10" fill="#FAF7F0" stroke="#173B32" stroke-width="3"/>
    <path d="M 245 92 L 235 55 L 250 55 L 258 90 Z" fill="#EFE5D2" opacity="0.8" stroke="#173B32" stroke-width="1.5"/>

    <!-- Adventure Handlebars & Knuckle Guards -->
    <line x1="225" y1="80" x2="245" y2="78" stroke="#20211D" stroke-width="4"/>
    <ellipse cx="225" cy="80" rx="5" ry="4" fill="#B65E3C"/>
  </g>

  <!-- Editorial Vintage Frame & Devanagari Annotation -->
  <rect x="14" y="14" width="772" height="472" fill="none" stroke="#173B32" stroke-width="2" opacity="0.3"/>
  <text x="32" y="465" font-family="serif" font-size="14" font-weight="bold" fill="#FAF4E8" letter-spacing="2">VANVAS EXPEDITION • HIMALAYAN ADVENTURE 450</text>
  <text x="768" y="465" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#B49252" letter-spacing="1">HILL-TUNED • 21-INCH RALLY FRONT</text>
</svg>
