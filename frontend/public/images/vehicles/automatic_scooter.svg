<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Editorial Palette Gradients -->
    <linearGradient id="scooterSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2D4BF"/>
      <stop offset="60%" stop-color="#EFE5D2"/>
      <stop offset="100%" stop-color="#FAF6F0"/>
    </linearGradient>
    <linearGradient id="scooterMtnFar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C9A8E"/>
      <stop offset="100%" stop-color="#A2B0A4"/>
    </linearGradient>
    <linearGradient id="scooterMtnMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#466555"/>
      <stop offset="100%" stop-color="#244033"/>
    </linearGradient>
    <linearGradient id="scooterRoad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E675B"/>
      <stop offset="50%" stop-color="#544E44"/>
      <stop offset="100%" stop-color="#3D372E"/>
    </linearGradient>
    <linearGradient id="bodyTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C86A46"/>
      <stop offset="50%" stop-color="#B65E3C"/>
      <stop offset="100%" stop-color="#8A3E20"/>
    </linearGradient>
    <linearGradient id="innerPanelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#423C36"/>
      <stop offset="100%" stop-color="#26221D"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E2D8"/>
      <stop offset="50%" stop-color="#BDB3A6"/>
      <stop offset="100%" stop-color="#8C8276"/>
    </linearGradient>
    <linearGradient id="seatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D3833"/>
      <stop offset="100%" stop-color="#1E1C1A"/>
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="500" fill="url(#scooterSky)"/>

  <!-- Himalayan Town & Ridge Horizon -->
  <!-- Distant High Ridge -->
  <path d="M 0 250 L 120 190 L 220 230 L 350 140 L 460 210 L 590 125 L 700 185 L 800 150 L 800 360 L 0 360 Z" fill="url(#scooterMtnFar)" opacity="0.6"/>
  <polygon points="350,140 380,180 320,180" fill="#FAF6F0" opacity="0.8"/>
  <polygon points="590,125 630,170 550,170" fill="#FAF6F0" opacity="0.8"/>

  <!-- Midground Pine Slopes & Himalayan Hillside Village Silhouette -->
  <path d="M 0 310 Q 180 250 360 280 T 800 270 L 800 420 L 0 420 Z" fill="url(#scooterMtnMid)"/>

  <!-- Stylized Hill Town Architecture Silhouettes (Tiered Mountain Roofs) -->
  <g fill="#EFE5D2" opacity="0.7">
    <!-- Building 1 -->
    <rect x="620" y="240" width="35" height="30"/>
    <polygon points="615,240 637,222 660,240"/>
    <!-- Building 2 -->
    <rect x="665" y="232" width="28" height="38"/>
    <polygon points="660,232 679,218 698,232"/>
    <!-- Building 3 -->
    <rect x="702" y="245" width="40" height="25"/>
    <polygon points="698,245 722,228 746,245"/>
  </g>

  <!-- Mountain Trees / Cedar Silhouettes -->
  <g fill="#173B32" opacity="0.9">
    <polygon points="80,285 70,335 90,335"/><polygon points="80,265 73,305 87,305"/><polygon points="80,248 75,280 85,280"/>
    <polygon points="120,270 110,330 130,330"/><polygon points="120,250 112,295 128,295"/>
    <polygon points="540,265 530,320 550,320"/><polygon points="540,245 533,285 547,285"/>
  </g>

  <!-- Mountain Road Surface -->
  <path d="M 0 375 Q 260 360 520 385 T 800 380 L 800 500 L 0 500 Z" fill="url(#scooterRoad)"/>
  <!-- Mountain Road Verge / Stone Retaining Wall -->
  <path d="M 0 375 L 800 378" stroke="#B49252" stroke-width="2" stroke-dasharray="14,14" opacity="0.6"/>

  <!-- Road Stone Guard -->
  <rect x="40" y="355" width="22" height="18" rx="2" fill="#D2C8B8" stroke="#5C5549" stroke-width="1.5"/>
  <rect x="720" y="358" width="22" height="18" rx="2" fill="#D2C8B8" stroke="#5C5549" stroke-width="1.5"/>

  <!-- Vehicle Ground Shadow -->
  <ellipse cx="395" cy="430" rx="230" ry="16" fill="#201A14" opacity="0.45"/>

  <!-- ================= ACTIVA-STYLE AUTOMATIC SCOOTER ================= -->
  <g id="activa_scooter">
    <!-- Rear 10-inch Scooter Wheel -->
    <g id="scooter_rear_wheel">
      <circle cx="260" cy="395" r="48" fill="#1C1B1A"/>
      <circle cx="260" cy="395" r="34" fill="#3D3B38" stroke="url(#chromeGrad)" stroke-width="4"/>
      <circle cx="260" cy="395" r="14" fill="url(#chromeGrad)"/>
      <circle cx="260" cy="395" r="5" fill="#1C1B1A"/>
    </g>

    <!-- Front 10/12-inch Scooter Wheel -->
    <g id="scooter_front_wheel">
      <circle cx="550" cy="395" r="50" fill="#1C1B1A"/>
      <circle cx="550" cy="395" r="36" fill="#3D3B38" stroke="url(#chromeGrad)" stroke-width="4"/>
      <circle cx="550" cy="395" r="14" fill="url(#chromeGrad)"/>
      <circle cx="550" cy="395" r="5" fill="#1C1B1A"/>
    </g>

    <!-- Trailing Link Front Suspension -->
    <path d="M 550 395 L 535 345" stroke="url(#chromeGrad)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="535" cy="345" r="5" fill="#222"/>

    <!-- Front Mudguard / Fender -->
    <path d="M 505 375 C 510 335 560 335 580 375 L 565 380 C 550 350 525 350 518 380 Z" fill="url(#bodyTerracotta)" stroke="#6B2C14" stroke-width="1.8"/>

    <!-- Rear Metal Engine Cover / Side Cowl (Bulbous Scooter Body) -->
    <path d="M 210 380 C 210 310 270 290 355 295 L 350 360 C 330 380 260 410 210 380 Z" fill="url(#bodyTerracotta)" stroke="#6B2C14" stroke-width="2"/>
    <!-- Body Aerodynamic Swage Line / Chrome Strip -->
    <path d="M 230 350 C 270 335 315 330 350 338" fill="none" stroke="url(#chromeGrad)" stroke-width="2"/>
    <!-- Air Cooling Vents on Engine Cowl -->
    <line x1="315" y1="355" x2="335" y2="355" stroke="#3D1E12" stroke-width="2" stroke-linecap="round"/>
    <line x1="312" y1="362" x2="332" y2="362" stroke="#3D1E12" stroke-width="2" stroke-linecap="round"/>
    <line x1="310" y1="369" x2="330" y2="369" stroke="#3D1E12" stroke-width="2" stroke-linecap="round"/>

    <!-- Compact Automatic Exhaust / Silencer with Heat Shield -->
    <path d="M 230 405 L 305 398 C 315 398 320 390 315 385 L 290 385 Z" fill="#222" stroke="#111" stroke-width="1.5"/>
    <rect x="235" y="392" width="60" height="10" rx="3" fill="url(#chromeGrad)" stroke="#555" stroke-width="1"/>

    <!-- Flat Step-Through Floorboard & Inner Apron -->
    <path d="M 350 360 L 440 360 L 460 300 L 430 300 L 350 340 Z" fill="url(#innerPanelGrad)" stroke="#1A1815" stroke-width="1.5"/>
    <!-- Floorboard Foot Mat Ribs -->
    <line x1="365" y1="357" x2="425" y2="357" stroke="#111" stroke-width="2"/>

    <!-- Front Apron / Metal Leg Shield -->
    <path d="M 440 360 C 465 310 475 260 485 240 L 515 242 C 505 285 490 340 460 365 Z" fill="url(#bodyTerracotta)" stroke="#6B2C14" stroke-width="2"/>
    <!-- Front Apron Center Bezel & Turn Indicators -->
    <path d="M 488 250 L 505 252 L 498 285 L 485 280 Z" fill="#2E2822"/>
    <polygon points="502,255 510,257 506,275 500,273" fill="#B49252" opacity="0.9"/>
    <!-- Chrome Trim on Apron -->
    <path d="M 495 248 L 490 282" stroke="url(#chromeGrad)" stroke-width="1.8"/>

    <!-- Contoured Dual-Comfort Seat -->
    <path d="M 230 300 C 240 280 340 275 410 295 C 400 312 360 315 230 305 Z" fill="url(#seatGrad)" stroke="#111" stroke-width="2"/>
    <path d="M 245 295 C 300 285 365 285 395 295" stroke="#4D4842" stroke-width="1.2" fill="none"/>

    <!-- Aluminum Rear Grab Rail / Luggage Carrier -->
    <path d="M 215 305 Q 200 295 210 285 L 235 290" fill="none" stroke="url(#chromeGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Handlebar Cowl with Integrated Headlamp -->
    <path d="M 470 238 C 475 215 510 212 525 232 C 520 248 485 250 470 238 Z" fill="url(#bodyTerracotta)" stroke="#6B2C14" stroke-width="1.8"/>
    <!-- Integrated Headlamp Lens -->
    <path d="M 508 218 C 522 218 528 226 524 236 C 516 238 506 232 508 218 Z" fill="#FAF6F0" stroke="url(#chromeGrad)" stroke-width="1.5"/>
    <ellipse cx="518" cy="226" rx="4" ry="6" fill="#FFF" opacity="0.9"/>

    <!-- Rearview Mirrors -->
    <line x1="480" y1="220" x2="465" y2="198" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="462" cy="195" rx="7" ry="5" fill="#2E2822" stroke="url(#chromeGrad)" stroke-width="1"/>

    <line x1="505" y1="216" x2="498" y2="194" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="496" cy="192" rx="7" ry="5" fill="#2E2822" stroke="url(#chromeGrad)" stroke-width="1"/>

    <!-- Center / Side Stand -->
    <line x1="330" y1="385" x2="320" y2="425" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Foreground Atmospheric Foliage (Himalayan Ferns / Stones) -->
  <path d="M 0 492 Q 80 465 170 485 L 180 500 L 0 500 Z" fill="#173B32" opacity="0.35"/>
  <path d="M 680 500 Q 740 470 800 488 L 800 500 Z" fill="#173B32" opacity="0.35"/>
</svg>
