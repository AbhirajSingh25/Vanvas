<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Editorial Palette Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5D9C5"/>
      <stop offset="60%" stop-color="#EFE5D2"/>
      <stop offset="100%" stop-color="#F5EFE6"/>
    </linearGradient>
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C9A8E"/>
      <stop offset="100%" stop-color="#A4B2A6"/>
    </linearGradient>
    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A5A4A"/>
      <stop offset="100%" stop-color="#244033"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#736B5E"/>
      <stop offset="50%" stop-color="#5C5549"/>
      <stop offset="100%" stop-color="#484238"/>
    </linearGradient>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E473D"/>
      <stop offset="45%" stop-color="#173B32"/>
      <stop offset="100%" stop-color="#0E2620"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2DCD2"/>
      <stop offset="50%" stop-color="#B8AEA2"/>
      <stop offset="100%" stop-color="#8A8074"/>
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C462B"/>
      <stop offset="100%" stop-color="#5E2C1A"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9A84E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#B65E3C" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Morning Sun / Himalayan Glow -->
  <circle cx="620" cy="140" r="90" fill="url(#sunGlow)"/>

  <!-- Distant Snow & Ridge Peaks -->
  <path d="M 0 260 L 110 180 L 190 220 L 320 130 L 410 190 L 520 110 L 640 200 L 730 150 L 800 210 L 800 350 L 0 350 Z" fill="url(#mountainFar)" opacity="0.6"/>
  <!-- Snow Highlights on Far Peaks -->
  <polygon points="320,130 350,170 290,170" fill="#FAF6F0" opacity="0.75"/>
  <polygon points="520,110 560,160 480,160" fill="#FAF6F0" opacity="0.75"/>
  <polygon points="110,180 140,210 80,210" fill="#FAF6F0" opacity="0.6"/>

  <!-- Midground Pine Ridge & Foothills -->
  <path d="M 0 320 Q 150 250 320 290 T 650 270 Q 740 285 800 310 L 800 420 L 0 420 Z" fill="url(#mountainMid)"/>

  <!-- Stylized Himalayan Deodar / Pine Silhouettes -->
  <g fill="#173B32" opacity="0.85">
    <!-- Cluster Left -->
    <polygon points="40,280 32,320 48,320"/><polygon points="40,265 34,295 46,295"/><polygon points="40,250 36,275 44,275"/>
    <polygon points="65,270 55,320 75,320"/><polygon points="65,250 58,290 72,290"/><polygon points="65,235 60,265 70,265"/>
    <polygon points="90,285 82,325 98,325"/><polygon points="90,270 84,300 96,300"/>
    <!-- Cluster Right -->
    <polygon points="690,260 680,310 700,310"/><polygon points="690,240 683,280 697,280"/>
    <polygon points="720,250 710,310 730,310"/><polygon points="720,230 712,275 728,275"/><polygon points="720,215 715,250 725,250"/>
    <polygon points="750,265 742,315 758,315"/>
  </g>

  <!-- Mountain Pass Road & Valley Terrace -->
  <path d="M 0 380 Q 250 360 500 390 T 800 385 L 800 500 L 0 500 Z" fill="url(#roadGrad)"/>
  <!-- Stone Parapet / Road Verge Markers -->
  <rect x="30" y="360" width="22" height="18" rx="2" fill="#D2C8B8" stroke="#5C5549" stroke-width="1.5"/>
  <rect x="120" y="358" width="22" height="18" rx="2" fill="#D2C8B8" stroke="#5C5549" stroke-width="1.5"/>
  <rect x="710" y="362" width="24" height="20" rx="2" fill="#D2C8B8" stroke="#5C5549" stroke-width="1.5"/>

  <!-- Milestone in Vanvas Terracotta & Ochre -->
  <path d="M 680 345 Q 692 335 704 345 L 704 375 L 680 375 Z" fill="#B49252"/>
  <rect x="680" y="355" width="24" height="20" fill="#FAF6F0"/>

  <!-- Shadow under Motorcycle -->
  <ellipse cx="400" cy="425" rx="260" ry="18" fill="#241E17" opacity="0.45"/>

  <!-- ================= CLASSIC BULLET MOTORCYCLE ================= -->
  <g id="classic_bullet_bike">
    <!-- Rear Wheel -->
    <g id="rear_wheel">
      <circle cx="240" cy="380" r="62" fill="#1C1B1A"/>
      <circle cx="240" cy="380" r="50" fill="none" stroke="url(#chromeGrad)" stroke-width="7"/>
      <circle cx="240" cy="380" r="16" fill="url(#chromeGrad)"/>
      <!-- Spokes -->
      <g stroke="#D2C8B8" stroke-width="1.2" opacity="0.75">
        <line x1="240" y1="380" x2="240" y2="330"/><line x1="240" y1="380" x2="240" y2="430"/>
        <line x1="240" y1="380" x2="190" y2="380"/><line x1="240" y1="380" x2="290" y2="380"/>
        <line x1="240" y1="380" x2="205" y2="345"/><line x1="240" y1="380" x2="275" y2="415"/>
        <line x1="240" y1="380" x2="205" y2="415"/><line x1="240" y1="380" x2="275" y2="345"/>
        <line x1="240" y1="380" x2="220" y2="333"/><line x1="240" y1="380" x2="260" y2="427"/>
        <line x1="240" y1="380" x2="220" y2="427"/><line x1="240" y1="380" x2="260" y2="333"/>
      </g>
    </g>

    <!-- Front Wheel -->
    <g id="front_wheel">
      <circle cx="560" cy="380" r="64" fill="#1C1B1A"/>
      <circle cx="560" cy="380" r="52" fill="none" stroke="url(#chromeGrad)" stroke-width="7"/>
      <circle cx="560" cy="380" r="16" fill="url(#chromeGrad)"/>
      <!-- Spokes -->
      <g stroke="#D2C8B8" stroke-width="1.2" opacity="0.75">
        <line x1="560" y1="380" x2="560" y2="328"/><line x1="560" y1="380" x2="560" y2="432"/>
        <line x1="560" y1="380" x2="508" y2="380"/><line x1="560" y1="380" x2="612" y2="380"/>
        <line x1="560" y1="380" x2="523" y2="343"/><line x1="560" y1="380" x2="597" y2="417"/>
        <line x1="560" y1="380" x2="523" y2="417"/><line x1="560" y1="380" x2="597" y2="343"/>
        <line x1="560" y1="380" x2="538" y2="331"/><line x1="560" y1="380" x2="582" y2="429"/>
        <line x1="560" y1="380" x2="538" y2="429"/><line x1="560" y1="380" x2="582" y2="331"/>
      </g>
    </g>

    <!-- Classic Deep Rear Mudguard / Fender -->
    <path d="M 180 380 C 180 320 220 295 285 305 L 290 325 C 240 320 205 345 202 380 Z" fill="url(#tankGrad)" stroke="#112B24" stroke-width="2"/>
    <!-- Gold Pinstripe on Rear Mudguard -->
    <path d="M 190 375 C 190 330 225 310 275 318" fill="none" stroke="#B49252" stroke-width="1.8" opacity="0.9"/>

    <!-- Classic Front Mudguard / Fender -->
    <path d="M 505 330 C 535 305 585 308 615 340 L 602 350 C 578 325 538 322 515 342 Z" fill="url(#tankGrad)" stroke="#112B24" stroke-width="2"/>
    <!-- Gold Pinstripe on Front Mudguard -->
    <path d="M 520 332 C 545 316 575 318 600 340" fill="none" stroke="#B49252" stroke-width="1.8" opacity="0.9"/>

    <!-- Front Telescopic Forks & Gaiters -->
    <line x1="560" y1="380" x2="512" y2="245" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="545" y1="340" x2="532" y2="300" stroke="#222" stroke-width="11" stroke-linecap="round"/>

    <!-- Classic Engine Block & Air-Cooled Cylinder Fins -->
    <rect x="340" y="325" width="80" height="65" rx="6" fill="#2E3331" stroke="#1A1C1B" stroke-width="2"/>
    <!-- Cooling Fins -->
    <line x1="336" y1="335" x2="422" y2="335" stroke="url(#chromeGrad)" stroke-width="2.5"/>
    <line x1="336" y1="343" x2="422" y2="343" stroke="url(#chromeGrad)" stroke-width="2.5"/>
    <line x1="336" y1="351" x2="422" y2="351" stroke="url(#chromeGrad)" stroke-width="2.5"/>
    <line x1="336" y1="359" x2="422" y2="359" stroke="url(#chromeGrad)" stroke-width="2.5"/>
    <line x1="336" y1="367" x2="422" y2="367" stroke="url(#chromeGrad)" stroke-width="2.5"/>
    <!-- Crankcase (Polished Aluminum) -->
    <ellipse cx="375" cy="385" rx="30" ry="20" fill="url(#chromeGrad)" stroke="#555" stroke-width="1.5"/>
    <circle cx="375" cy="385" r="10" fill="#736B5E"/>

    <!-- Classic Long Chrome Exhaust Pipe (Iconic Thump Pipe) -->
    <path d="M 405 350 C 430 350 435 395 410 405 L 210 405 C 195 405 185 400 180 395" fill="none" stroke="url(#chromeGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 290 405 L 180 405" stroke="url(#chromeGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Tubular Cradle Frame & Swingarm -->
    <path d="M 510 250 L 375 285 L 340 385 L 240 380" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>
    <line x1="375" y1="285" x2="280" y2="340" stroke="#1A1A1A" stroke-width="5"/>
    <!-- Classic Rear Chrome Shocker Springs -->
    <line x1="260" y1="375" x2="295" y2="315" stroke="url(#chromeGrad)" stroke-width="6"/>

    <!-- Oval Chrome Battery / Tool Box -->
    <path d="M 305 340 Q 330 335 335 360 Q 330 380 305 375 Z" fill="url(#tankGrad)" stroke="#B49252" stroke-width="1.5"/>

    <!-- Iconic Teardrop Fuel Tank with Pinstripes -->
    <path d="M 375 280 C 375 240 460 235 510 255 C 505 280 460 295 385 290 Z" fill="url(#tankGrad)" stroke="#112B24" stroke-width="2.5"/>
    <!-- Chrome Tank Badge Contour -->
    <ellipse cx="440" cy="265" rx="20" ry="12" fill="url(#chromeGrad)" stroke="#FAF6F0" stroke-width="1"/>
    <path d="M 430 265 Q 440 260 450 265" stroke="#173B32" stroke-width="2" fill="none"/>
    <!-- Hand-laid Gold Pinstriping -->
    <path d="M 390 275 C 400 250 455 245 495 260 C 480 278 450 286 398 282" fill="none" stroke="#B49252" stroke-width="1.8"/>

    <!-- Chrome Fuel Filler Cap -->
    <ellipse cx="455" cy="244" rx="7" ry="3" fill="url(#chromeGrad)" stroke="#FAF6F0" stroke-width="1"/>

    <!-- Classic Spring-Mounted Rider Saddle & Pilllon Pad -->
    <!-- Sprung Rider Seat -->
    <path d="M 305 285 C 320 280 360 280 380 287 C 375 302 330 305 305 285 Z" fill="url(#leatherGrad)" stroke="#381B10" stroke-width="2"/>
    <!-- Chrome Seat Springs -->
    <circle cx="315" cy="296" r="3.5" fill="none" stroke="url(#chromeGrad)" stroke-width="2"/>
    <!-- Pillion Seat -->
    <path d="M 235 298 C 255 292 290 292 298 300 C 290 312 250 312 235 298 Z" fill="url(#leatherGrad)" stroke="#381B10" stroke-width="1.8"/>

    <!-- Classic Casquette / Headlamp Nacelle & Handlebars -->
    <path d="M 495 242 L 530 238 L 525 255 L 495 250 Z" fill="url(#tankGrad)" stroke="#112B24" stroke-width="1.5"/>
    <!-- Chrome Round Headlamp & Amber Pilot Lamp -->
    <path d="M 525 240 C 538 240 545 248 542 258 C 538 266 525 266 522 256 Z" fill="url(#chromeGrad)" stroke="#FAF6F0" stroke-width="1.5"/>
    <ellipse cx="538" cy="250" rx="3" ry="5" fill="#FAF6F0" opacity="0.9"/>
    <!-- Classic Upright Handlebars & Round Mirrors -->
    <path d="M 498 240 Q 480 215 468 205" fill="none" stroke="url(#chromeGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="465" cy="202" r="6" fill="url(#chromeGrad)" stroke="#FAF6F0" stroke-width="1"/>
    <rect x="460" y="208" width="14" height="5" rx="2" fill="#222"/>

    <!-- Classic Crash Guard / Leg Guard -->
    <path d="M 450 285 C 475 285 480 350 455 355" fill="none" stroke="url(#chromeGrad)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Foreground Editorial Framing (Subtle Mountain Flora / Stone) -->
  <path d="M 0 490 Q 60 460 140 480 L 150 500 L 0 500 Z" fill="#173B32" opacity="0.3"/>
  <path d="M 700 500 Q 750 470 800 485 L 800 500 Z" fill="#173B32" opacity="0.3"/>
</svg>
